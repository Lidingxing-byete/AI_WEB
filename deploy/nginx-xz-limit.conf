# 芯诊 AI 演示的限流配置（放在 /etc/nginx/conf.d/xz-limit.conf）
#
# 为什么需要：/xz/api/tasks 是公开写接口，不限流会被脚本刷库。
# 放在 conf.d 下即可——nginx.conf 已把 conf.d/*.conf include 进 http{}，
# 而 limit_req_zone / limit_conn_zone 必须位于 http 上下文。
#
# 档位说明：
#   rate=180r/m ≈ 3 req/s 均值；burst=60 允许突发（一轮诊断约 10 个请求，正常使用不受影响）。
#   实测：连续 120 次请求 → 78×200 + 42×429，符合预期。

limit_req_zone  $binary_remote_addr zone=xz_api:10m  rate=180r/m;
limit_conn_zone $binary_remote_addr zone=xz_conn:10m;

limit_req_status  429;
limit_conn_status 429;

# 在 /xz/api/ 的 location 内加两行（deploy/nginx-xz-snippet.conf 已包含）：
#   limit_req  zone=xz_api burst=60 nodelay;
#   limit_conn xz_conn 20;
