    # ==================================================================
    # 芯诊 AI 在线演示（/xz/）—— 由 deploy/install_on_aliyun.sh 自动插入
    # 与博客（Next.js :3000）共存：只占 /xz/ 前缀，其余路径仍走 location /
    # ==================================================================
    location /xz/ {
        root /opt/xinzhen/www;
        index index.html;
        # 单页应用兜底：找不到文件回 index.html
        try_files $uri $uri/ /xz/index.html;
    }

    # 带 hash 的静态资源可长缓存；index.html 必须每次回源
    location /xz/assets/ {
        root /opt/xinzhen/www;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /xz/index.html {
        root /opt/xinzhen/www;
        add_header Cache-Control "no-store";
    }

    # 后端 API：SSE 必须关缓冲，且 Connection 不能沿用外层的 "upgrade"
    location /xz/api/ {
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache     off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        client_max_body_size 5m;
    }

    # ---- 可选：给演示加一道口令（评审用 demo/密码 登录） ----
    # htpasswd -c /etc/nginx/.htpasswd demo     # 需要 httpd-tools
    # 然后在 location /xz/ 与 location /xz/api/ 里各加两行：
    #   auth_basic           "Xinzhen Demo";
    #   auth_basic_user_file /etc/nginx/.htpasswd;
