# 芯诊 AI · Nginx 片段（部署在 https://你的域名/xz/）
#
# 用法：把下面两段 location 放进你博客 server{} 里（HTTPS 那一块），
#      然后 nginx -t && systemctl reload nginx。
# 路径按需替换：/opt/xinzhen/web 为前端构建产物目录。

# ---------------------------------------------------------------- 前端静态
location /xz/ {
    alias /opt/xinzhen/web/;
    index index.html;

    # 单页应用：找不到文件就回 index.html（本项目只有一个页面，保留兜底）
    try_files $uri $uri/ /xz/index.html;

    # 带 hash 的静态资源可长缓存；index.html 必须每次回源，否则更新不生效
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /xz/index.html {
        add_header Cache-Control "no-store";
    }
}

# ---------------------------------------------------------------- 后端 API
location /xz/api/ {
    # 子路径 -> 后端根路径（后端本身挂在 /api 下）
    proxy_pass http://127.0.0.1:8787/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # SSE 关键：诊断过程是流式的，缓冲会导致"憋住一次性吐出来"
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    chunked_transfer_encoding on;

    # 材料上限与后端一致（2MB 内容 + JSON 开销）
    client_max_body_size 5m;
}

